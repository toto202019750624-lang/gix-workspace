services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gix
      POSTGRES_PASSWORD: gix
      POSTGRES_DB: gix
    ports:
      - "5432:5432"
    volumes:
      - gix_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gix -d gix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gix_pg:
